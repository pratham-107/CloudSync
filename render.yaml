services:
  # Free managed Redis-compatible cache (Valkey 8). Internal URL is wired
  # into the API below automatically via fromService.
  - type: keyvalue
    name: cloudsync-redis
    plan: free
    maxmemoryPolicy: noeviction

  - type: web
    name: cloudsync-api
    runtime: docker
    plan: free
    dockerfilePath: ./server/Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Frontend origin (CORS). Match the Render static site / deployed client URL.
      - key: CLIENT_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        fromService:
          name: cloudsync-redis
          type: keyvalue
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 7d
      - key: JWT_REFRESH_EXPIRATION
        value: 30d
      # Filebase (free, S3-compatible, no credit card). endpoint: https://s3.filebase.io
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: auto
      - key: AWS_S3_BUCKET
        sync: false
      - key: AWS_S3_ENDPOINT
        sync: false
      # Private private-storage: leave empty so the API mints presigned GET urls
      # for previews/downloads (no public buckets on the Filebase free tier).
      - key: AWS_PUBLIC_BASE_URL
        sync: false